<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{--bg:#0b1020;--dots:#161d36;--ink:#e8f1ff;--muted:#8a93a3;--orange:#ffb347;--green:#7dffa0;--edge:#000;--panel:#1b1f27}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"VT323",ui-monospace,Menlo,Consolas,monospace;font-size:20px;
  background-image:radial-gradient(var(--dots) 1px,transparent 1px);background-size:8px 8px;
  padding:clamp(16px,4vw,40px) clamp(12px,3vw,32px) 48px}
main{max-width:1000px;margin:0 auto}
h1{font-family:"Press Start 2P",monospace;font-weight:400;text-align:center;color:var(--orange);
  font-size:clamp(22px,6vw,48px);letter-spacing:.08em;line-height:1.4;margin:clamp(8px,3vw,32px) 0 clamp(20px,4vw,40px);
  text-shadow:4px 4px 0 var(--edge)}
#grid{display:grid;gap:clamp(8px,1.6vw,18px);justify-content:center;
  grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))}
.card{container-type:inline-size;display:block;text-decoration:none;color:inherit;background:var(--panel);
  border:4px solid #4a505c;box-shadow:0 4px 0 var(--edge);overflow:hidden;position:relative;
  transition:transform .08s,border-color .08s}
.card:hover,.card:focus-visible{border-color:var(--green);transform:translateY(-2px);outline:none}
.card:active{transform:translateY(2px)}
.thumb{aspect-ratio:16/9;width:100%;display:block;background:#000;image-rendering:pixelated;object-fit:cover}
.meta{padding:3cqw 4cqw 4cqw;display:flex;flex-direction:column;gap:1.5cqw}
.name{font-family:"Press Start 2P",monospace;font-size:clamp(6px,5.2cqw,16px);line-height:1.5;color:var(--orange)}
.desc{font-size:clamp(11px,6.4cqw,21px);line-height:1.1;color:var(--muted)}
.card.few .desc{display:block}
.tiny .desc{display:none}
.soon{color:var(--muted);text-align:center;margin-top:28px;font-size:17px}
</style>
</head>
<body>
<main>
<h1>BIENVENUE</h1>
<div id="grid"></div>
<p class="soon">D'autres jeux arrivent bientôt.</p>
</main>
<script>
/* Pour ajouter un jeu : une ligne dans GAMES, c'est tout. Les cases se réduisent toutes seules. */
const GAMES = [
  { name: "Pixel Flight", desc: "Simulateur de vol en pixels, sans moteur 3D.", href: "pixel-flight/", img: "pixel-flight/apercu.jpg" },
  { name: "Une Vie en Bourse", desc: "Une vie au hasard, ton épargne sur les vrais marchés. Modes classique et complet.", href: "une-vie-en-bourse/", art: "bourse" }
];

/* vignette dessinée en pixels pour les jeux sans image */
function art(kind) {
  const c = document.createElement("canvas"); c.width = 64; c.height = 36; c.className = "thumb";
  const g = c.getContext("2d");
  g.fillStyle = "#13161c"; g.fillRect(0, 0, 64, 36);
  g.fillStyle = "#23304a"; for (let y = 6; y < 36; y += 8) g.fillRect(0, y, 64, 1);
  if (kind === "bourse") {
    let v = 22; const pts = [];
    for (let x = 0; x < 64; x += 2) { v += Math.sin(x * 0.45) * 2 + 0.55 - ((x * 7) % 5) * 0.35; pts.push(v); }
    pts.forEach((p, i) => { const x = i * 2, y = Math.max(3, Math.min(33, Math.round(36 - p)));
      g.fillStyle = "#f2b400"; g.fillRect(x, y, 2, 2);
      g.fillStyle = "#1d7a3c"; g.fillRect(x, y + 2, 2, 36 - y); });
    g.fillStyle = "#f2b400"; g.fillRect(55, 4, 5, 5); g.fillRect(56, 3, 3, 7);
  }
  return c;
}

const grid = document.getElementById("grid");
const n = GAMES.length;
/* plus il y a de jeux, plus il y a de colonnes, donc plus les cases sont petites */
const cols = n <= 1 ? 1 : Math.min(8, Math.ceil(Math.sqrt(n)));
grid.style.setProperty("--cols", cols);
grid.style.maxWidth = (n === 1 ? 420 : Math.min(1000, 330 * cols)) + "px";
grid.style.margin = "0 auto";
GAMES.forEach(gm => {
  const a = document.createElement("a");
  a.className = "card" + (cols >= 4 ? " tiny" : "");
  a.href = gm.href;
  a.setAttribute("aria-label", gm.name);
  if (gm.img) { const i = document.createElement("img"); i.className = "thumb"; i.src = gm.img; i.alt = ""; a.appendChild(i); }
  else a.appendChild(art(gm.art));
  const m = document.createElement("div"); m.className = "meta";
  m.innerHTML = '<div class="name"></div><div class="desc"></div>';
  m.firstChild.textContent = gm.name; m.lastChild.textContent = gm.desc;
  a.appendChild(m); grid.appendChild(a);
});
</script>
</body>
</html>
