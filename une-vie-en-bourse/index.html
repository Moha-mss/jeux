<style>
/* Layout: arcade cabinet column; sticky HUD on top, tabs at the yearly stop, fixed action bar at the bottom; charts are always a dark "LCD screen" */
:root{
  /* thème clair : console de poche, crème et vert */
  --bg:#d9d4b8; --dots:#c4bd99; --panel:#f3eedb; --panel2:#e4dec3; --ink:#23291c; --muted:#5d6449;
  --hl:#7a4f00; --accent:#f2b400; --onaccent:#23291c; --gain:#1d7a3c; --loss:#b8352a; --line:#b9b28f; --edge:#23291c;
  --paper:#fbf6e4; --paperink:#2a2018; --screen:#13161c; --veil:rgba(35,41,28,.6); --tab:#e4dec3; --tabon:#23291c; --ontabon:#f3eedb;
  --pix:"Press Start 2P", "Courier New", monospace;
  --txt:"VT323", "Courier New", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17122b; --dots:#2c2452; --panel:#251d45; --panel2:#30265a; --ink:#f2e9d8; --muted:#9a90c2;
  --hl:#f7c548; --accent:#f7c548; --onaccent:#1b1330; --gain:#5fd38d; --loss:#ff6b5e; --line:#4a3f80; --edge:#000;
  --paper:#efe4c8; --paperink:#2a2018; --screen:#100c20; --veil:rgba(10,7,22,.82); --tab:#30265a; --tabon:#f7c548; --ontabon:#1b1330;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17122b; --dots:#2c2452; --panel:#251d45; --panel2:#30265a; --ink:#f2e9d8; --muted:#9a90c2;
  --hl:#f7c548; --accent:#f7c548; --onaccent:#1b1330; --gain:#5fd38d; --loss:#ff6b5e; --line:#4a3f80; --edge:#000;
  --paper:#efe4c8; --paperink:#2a2018; --screen:#100c20; --veil:rgba(10,7,22,.82); --tab:#30265a; --tabon:#f7c548; --ontabon:#1b1330;
  color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--txt);font-size:21px;line-height:1.15;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px;
  background-image:radial-gradient(var(--dots) 1px, transparent 1px);background-size:8px 8px}
body.hasbar{padding-bottom:110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.cab{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
#app{display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--pix);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:22px;line-height:1.5;color:var(--hl);text-shadow:3px 3px 0 var(--edge)}
h2{font-size:12px;line-height:1.6}
h3{font-size:9px;line-height:1.6;color:var(--muted);letter-spacing:.05em}
p{margin:0}
b{color:var(--hl);font-weight:400}
.box{background:var(--panel);border:4px solid var(--edge);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.07);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.muted{color:var(--muted)} .small{font-size:17px} .good{color:var(--gain)} .bad{color:var(--loss)}
.btn{font-family:var(--pix);font-size:11px;line-height:1.4;color:var(--onaccent);background:var(--accent);border:4px solid var(--edge);padding:12px 14px;cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),0 4px 0 var(--edge)}
.btn:active{transform:translateY(3px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.25),0 1px 0 var(--edge)}
.btn:disabled{background:var(--muted);color:var(--panel);cursor:not-allowed;opacity:.7}
.btn.ghost{background:var(--panel2);color:var(--ink)}
.btn.sm{font-size:9px;padding:8px 10px}
.btn.danger{background:var(--loss);color:#fff}
button:focus-visible,input:focus-visible{outline:3px dashed var(--hl);outline-offset:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel2);border:3px solid var(--edge);padding:8px;min-width:0}
.stat .k{font-family:var(--pix);font-size:7px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;line-height:1.5}
.stat .v{font-size:25px;font-variant-numeric:tabular-nums;color:var(--hl);overflow-wrap:anywhere}
.eq{display:block;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top, 0px);z-index:9;background:var(--panel);border:4px solid var(--edge);border-top:0;padding:8px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--edge)}
#hud:empty{display:none}
.hudrow{display:flex;align-items:center;gap:8px}
.hudrow .when{font-family:var(--pix);font-size:10px;line-height:1.5;color:var(--hl);flex:1;min-width:0}
.hudrow .when small{display:block;font-family:var(--txt);font-size:17px;color:var(--muted)}
.hudrow .money{text-align:right;font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.hudrow .money small{display:block;font-size:15px;color:var(--muted)}
.ico{display:inline-flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:9px;min-width:34px;height:34px;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);cursor:pointer;padding:0 6px;flex:none}
.ico[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.hudrow .spacer{flex:1}
.flash{animation:flash .5s steps(2) 3}
@keyframes flash{50%{background:var(--loss);color:#fff}}
/* onglets */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tabs button{font-family:var(--pix);font-size:6.5px;line-height:1.5;padding:10px 2px;background:var(--tab);color:var(--ink);border:3px solid var(--edge);cursor:pointer;position:relative}
.tabs button[aria-selected="true"]{background:var(--tabon);color:var(--ontabon)}
.tabs .dot{position:absolute;top:-6px;right:-4px;background:var(--loss);color:#fff;font-size:7px;padding:2px 4px;border:2px solid var(--edge)}
/* barre d'action fixe */
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg);border-top:4px solid var(--edge);
  padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.actionbar .in{max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center}
.actionbar .btn{flex:1}
.actionbar .info{font-size:17px;color:var(--muted);max-width:40%}
canvas.chart{width:100%;aspect-ratio:12/5;image-rendering:pixelated;image-rendering:crisp-edges;background:var(--screen);border:3px solid var(--edge);display:block;max-width:100%;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:16px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:0;border:1px solid var(--edge)}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:3px dotted var(--line)}
.row:last-child{border-bottom:0}
.row .name{font-size:21px}
.row .desc{font-size:16px;color:var(--muted);line-height:1.1}
.risk{display:inline-flex;gap:2px;margin-left:6px;vertical-align:1px}
.risk b{width:5px;height:9px;background:var(--line)} .risk b.on{background:var(--loss)}
.ctrl{display:flex;align-items:center;gap:5px}
.sq{font-family:var(--pix);font-size:13px;width:32px;height:32px;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);cursor:pointer;padding:0}
.sq:disabled{opacity:.35;cursor:not-allowed}
.pctv{font-family:var(--pix);font-size:10px;width:42px;text-align:center;font-variant-numeric:tabular-nums}
.cur{font-size:15px;color:var(--muted)}
.new{font-family:var(--pix);font-size:7px;background:var(--gain);color:#fff;padding:3px 4px;margin-left:6px;vertical-align:3px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{font-family:var(--txt);font-size:19px;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);padding:8px 4px;cursor:pointer;line-height:1}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.seg small{display:block;font-size:15px;opacity:.85}
.log{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:18px}
.log div{padding-left:8px;border-left:4px solid var(--line)}
.log .good{border-color:var(--gain);color:var(--ink)} .log .bad{border-color:var(--loss);color:var(--ink)}
.log .news{border-color:var(--hl);color:var(--hl)} .log .info{border-color:#3f7fd9}
.yr{font-family:var(--pix);font-size:8px;color:var(--muted);margin-right:6px}
.gaz{background:var(--paper);color:var(--paperink);border:4px solid var(--edge);padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:6px 6px 0 var(--edge)}
.gaz .mast{font-family:var(--pix);font-size:12px;text-align:center;border-bottom:3px double var(--paperink);padding-bottom:6px;line-height:1.5}
.gaz .date{font-size:16px;text-align:center;margin-top:-4px}
.gaz .hl{font-size:21px;line-height:1.1;border-bottom:2px dotted rgba(42,32,24,.4);padding-bottom:6px}
.gaz .hl.sp{font-family:var(--pix);font-size:11px;line-height:1.5}
.gaz .hl .when{font-size:15px;opacity:.7;display:block}
.gaz .figs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-size:17px}
.gaz .figs span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}
.gaz p{color:var(--paperink)}
.overlay{position:fixed;inset:0;background:var(--veil);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:20;
  padding:calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.overlay .inner{max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}
.opts{display:grid;gap:8px}
.opt{font-family:var(--txt);text-align:left;font-size:21px;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);padding:10px 12px;cursor:pointer}
.opt small{display:block;font-size:17px;color:var(--hl)}
.tag{font-family:var(--pix);font-size:8px;background:var(--loss);color:#fff;padding:4px 6px;align-self:flex-start}
table.h{width:100%;border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums}
table.h td{padding:3px 4px;border-bottom:2px dotted var(--line)} table.h td:not(:first-child){text-align:right}
.bars{display:flex;flex-direction:column;gap:10px}
.bar .lab{display:flex;justify-content:space-between;gap:8px;font-size:18px}
.bar .tr{height:16px;background:var(--screen);border:3px solid var(--edge)}
.bar .fill{height:100%;background:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 8px)}
.grade{font-family:var(--pix);font-size:15px;color:var(--gain);line-height:1.5;text-align:center}
.coin{width:48px;height:48px;image-rendering:pixelated;flex:none}
.hero{display:flex;gap:14px;align-items:center}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:18px;cursor:pointer}
label.chk input{width:20px;height:20px;accent-color:var(--hl);margin-top:2px}
.code{font-family:var(--pix);font-size:13px;letter-spacing:.15em;color:var(--hl)}
.codein{display:flex;gap:8px}
.codein input{flex:1;min-width:0;font-family:var(--pix);font-size:13px;letter-spacing:.15em;text-transform:uppercase;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);padding:8px}
.btns{display:grid;gap:8px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--panel);font-size:19px;padding:8px 14px;border:3px solid var(--edge)}
/* catégories de placements */
details.grp{border-top:3px solid var(--edge);padding-top:6px}
details.grp summary{display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-family:var(--pix);font-size:9px;line-height:1.6;padding:6px 0;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:"▶";margin-right:6px}
details.grp[open] summary::before{content:"▼"}
details.grp summary span:first-child{flex:1}
.gsum{color:var(--hl)}
details.pmk{background:var(--panel);border:4px solid var(--edge);padding:6px 10px}
details.pmk summary::before{content:""}
/* marchés */
.mkt{padding:8px 0;border-bottom:3px dotted var(--line);display:flex;flex-direction:column;gap:4px}
.mkt:last-child{border-bottom:0}
.mtop{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mname{font-size:20px;min-width:0}
.mprice{font-size:20px;text-align:right;font-variant-numeric:tabular-nums;color:var(--hl)}
.mprice .eq{font-size:15px}
.mbot{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mbot .spacer{flex:1}
.chip{font-family:var(--pix);font-size:7px;padding:3px 5px;border:2px solid var(--edge);line-height:1.4;white-space:nowrap}
.chip.up{background:var(--gain);color:#fff}.chip.down{background:var(--loss);color:#fff}
.lock{font-family:var(--pix);font-size:6px;color:var(--muted);border:2px solid var(--line);padding:2px 4px;vertical-align:2px}
.spark{background:var(--screen);border:2px solid var(--edge);flex:none}
/* naissance */
.reel{position:relative;height:96px;overflow:hidden;background:var(--screen);border:4px solid var(--edge);box-shadow:inset 0 10px 0 rgba(0,0,0,.45),inset 0 -10px 0 rgba(0,0,0,.45)}
.reel::before,.reel::after{content:"";position:absolute;left:0;right:0;height:3px;background:#f7c548;z-index:2}
.reel::before{top:22px}.reel::after{bottom:22px}
.strip{position:absolute;left:0;right:0;top:0;will-change:transform}
.strip div{height:48px;display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:28px;color:#f7c548;text-shadow:3px 3px 0 #000}
.strip div.dim{color:#4a3f80;text-shadow:none}
.win{animation:win .18s steps(2) 6}
@keyframes win{50%{background:#f7c548}}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;padding-bottom:6px;border-bottom:3px dotted var(--line)}
.line .k{font-family:var(--pix);font-size:8px;color:var(--muted);line-height:1.6}
.line .v{font-size:24px;text-align:right}
.cursor{display:inline-block;width:10px;height:18px;background:var(--hl);vertical-align:-2px;animation:blinkc .6s steps(2) infinite}
@keyframes blinkc{50%{opacity:0}}
.tagline{font-family:var(--pix);font-size:10px;line-height:1.7;text-align:center;color:var(--gain);min-height:17px}
@media (prefers-reduced-motion: reduce){.new,.flash,.win,.cursor{animation:none}}

/* ===== version finale ===== */
.seg.modes{grid-template-columns:1fr} .seg.modes button{text-align:left;padding:8px 10px} .seg.modes small{display:inline;margin-left:6px}
.hudrow.ctrl{gap:4px} .hudrow.ctrl .ico{min-width:0;flex:0 1 34px;padding-inline:2px}
@media (max-width:380px){.hudrow.ctrl .spd{display:none}}
.opt.on{background:var(--accent);color:var(--onaccent)} .opt.on small{color:var(--onaccent)}
.seg.two{grid-template-columns:1fr 1fr} .seg.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.seg.four{grid-template-columns:1fr 1fr}}
.seg.two button{text-align:left;padding:10px 8px}
.btns2 .btn{display:flex;flex-direction:column;align-items:center;gap:4px}
.bsub{font-family:var(--txt);font-size:16px;opacity:.85;letter-spacing:0}
.search{width:100%;box-sizing:border-box;font-family:var(--txt);font-size:20px;background:var(--paper);color:var(--paperink);border:3px solid var(--edge);padding:6px 8px;margin:4px 0 10px}
.qm{font-family:var(--pix);font-size:9px;width:20px;height:20px;padding:0;border:2px solid var(--edge);background:var(--panel2);color:var(--ink);cursor:pointer;vertical-align:middle;margin-left:4px}
.fiche{background:var(--panel2);border:2px dashed var(--line);padding:6px 8px;margin:4px 0 8px;font-size:18px}
.fiche p{margin:0 0 6px}
.advice{border-top:2px dashed currentColor;margin-top:10px;padding-top:6px;font-size:18px}
.advice p{margin:4px 0}
.tip{position:absolute;pointer-events:none;background:#000;color:#f2e9d8;font-family:var(--txt);font-size:16px;line-height:1.1;padding:4px 6px;border:2px solid #f7c548;white-space:nowrap;z-index:5}
.ava{image-rendering:pixelated;flex:none;height:48px}
.hpie,.bigpie{image-rendering:pixelated;flex:none}
.hpie{width:40px;height:40px}
.hmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hmid .when{font-family:var(--pix);font-size:10px;line-height:1.5;color:var(--hl)}
.hmid .when small{display:block;font-family:var(--txt);font-size:17px;color:var(--muted)}
.hmid .money{font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.hmid .money small{font-size:15px;color:var(--muted);margin-left:6px}
.bubble{position:relative;background:var(--paper);color:var(--paperink);border:3px solid var(--edge);padding:3px 8px;font-size:17px;line-height:1.1;margin-left:8px;min-height:1.1em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bubble::before{content:"";position:absolute;left:10px;top:-9px;border:6px solid transparent;border-bottom-color:var(--edge);border-top:0}
.lt{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.ltr{position:relative;flex:1;height:8px;background:var(--panel2);border:2px solid var(--edge)}
.ltf{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.5}
.ld{position:absolute;top:-3px;width:6px;height:10px;margin-left:-3px;border:1px solid var(--edge)}
.ltm{position:absolute;top:-5px;width:2px;height:14px;background:var(--ink);margin-left:-1px}
.piebox{display:flex;gap:12px;align-items:center;margin:10px 0}
.bigpie{width:128px;height:128px}
.leg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:17px}
.leg i{display:inline-block;width:10px;height:10px;border:1px solid var(--edge);margin-right:4px}
.goals{display:grid;gap:6px}
.goal{display:flex;gap:8px;align-items:center;border:3px solid var(--edge);padding:6px 8px;background:var(--panel2)}
.goal .gk{font-family:var(--pix);font-size:12px;width:20px;text-align:center}
.goal.ok .gk{color:var(--gain)} .goal.ko{opacity:.75} .goal.ko .gk{color:var(--loss)}
select{font-family:var(--txt);font-size:19px;background:var(--panel2);color:var(--ink);border:3px solid var(--edge);padding:6px;width:100%;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
#fx{position:fixed;inset:0;z-index:100;pointer-events:none;image-rendering:pixelated}
.coinfx{position:fixed;width:16px;height:16px;z-index:60;pointer-events:none}
.coinfx svg{width:100%;height:100%}
.shake{animation:shake .4s steps(4)}
@keyframes shake{25%{transform:translateX(-4px)}50%{transform:translateX(4px)}75%{transform:translateX(-2px)}}
.gaz.drop{animation:drop .5s steps(5)}
@keyframes drop{from{transform:translateY(-30px) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.flip{animation:flip .45s steps(6)}
@keyframes flip{from{transform:perspective(600px) rotateY(90deg)}to{transform:none}}
@media (prefers-reduced-motion: reduce){.shake,.drop,.flip{animation:none}}

/* ===== mode Vie complète : nouvelle interface ===== */
body.vie{font-family:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;font-size:17px;line-height:1.3;transition:background .6s}

  for (const k in S.ghost) { const g = S.ghost[k]; if (x >= 0) ghostIn(g, x, t); else ghostOut(g, -x, t); S.bench[k] = ghostVal(g); }
}

// ===== Dettes : crédits, impayés, fichage à la Banque de France, surendettement =====
// Taux estimés à partir du taux du crédit immobilier de l'année : crédit auto +2 points, crédit conso +3,5, renouvelable +9 (plafonné à 21 %).
const loanRate = (kind, t) => { const cr = A[yearOf(t)].cr; return (kind === "rev" ? Math.min(21, cr + 9) : kind === "auto" ? cr + 2 : cr + 3.5) / 100; };
const annuity = (L, r, n) => { const i = r / 12; return i > 0 ? L * i / (1 - Math.pow(1 + i, -n)) : L / n; };
const pctRate = r => (r * 100).toFixed(1).replace(".", ",") + " %";
const LOAN_N = {auto:"Crédit auto", conso:"Crédit à la consommation", rev:"Crédit renouvelable", invest:"Crédit pour investir", plan:"Plan de surendettement"};
const ficp = t => t < S.ficpUntil;
const dueOf = (l, t) => Math.min(l.debt * (1 + l.rate / 12), l.kind === "rev" ? Math.max(0.03 * l.debt, 0.02 * baseSalary(t)) : l.pay);
const loanDue = t => (S.loans || []).reduce((s, l) => s + dueOf(l, t), 0);
const canBorrow = (t, pay) => S.kind !== "classique" && !ficp(t) && !S.plan && t >= S.unempUntil && loanDue(t) + (S.home && S.home.debt > 0 ? S.home.pay : 0) + pay <= 0.35 * (salary(t) + partnerSalary(t));
const revDebt = () => S.loans.filter(l => l.kind === "rev").reduce((s, l) => s + l.debt, 0);
const canRevolve = (t, a) => S.kind !== "classique" && !ficp(t) && !S.plan && t >= mi(1965, 1) && revDebt() + a <= 3 * baseSalary(t);
function newLoan(kind, amount, t, months) {
  const rate = loanRate(kind, t);
  if (kind === "rev") { const l = S.loans.find(x => x.kind === "rev"); if (l) { l.debt += amount; l.rate = rate; } else S.loans.push({kind, debt:amount, rate, pay:0, t0:t}); }
  else S.loans.push({kind, debt:amount, rate, pay:annuity(amount, rate, months), t0:t});
  logE(t, `${LOAN_N[kind]} : ${money(amount, t)} empruntés à ${pctRate(rate)}`, "info");
}
// Payer une dépense : les petites partent sur l'épargne ; pour les grosses (un mois de salaire ou plus), on suit ta règle ou on te demande
function spend(k, t, label) {
  if (S.kind === "classique" || k < baseSalary(t) || S.fast || S.payMode === "epargne") return payCash(k, t);
  if (S.payMode === "credit") { const kind = /oiture/.test(label) ? "auto" : "conso", n = kind === "auto" ? 48 : 36;
    if (canBorrow(t, annuity(k, loanRate(kind, t), n))) return newLoan(kind, k, t, n); return payCash(k, t); }
  if (S.pendingPay) settlePay("epargne");
  S.pendingPay = {amount:k, label, t};
}
function settlePay(how) {
  const pp = S.pendingPay; if (!pp) return; S.pendingPay = null; const t = Math.max(S.start, S.t - 1);
  if (how === "epargne") payCash(pp.amount, t);
  else if (how === "decouvert") { S.overdraft += pp.amount; S.everOverdraft = true; logE(t, `${pp.label} payé à découvert`, "info"); }
  else newLoan(how, pp.amount, t, how === "auto" ? 48 : 36);
}
function borrowToInvest(amount, t) { if (!canBorrow(t, annuity(amount, loanRate("invest", t), 60))) return false; newLoan("invest", amount, t, 60); cashIn(amount, t); return true; }
function repayLoan(i, t) { const l = S.loans[i]; if (!l || holdSum() < l.debt || S.plan) return false; payCash(l.debt, t); logE(t, `${LOAN_N[l.kind]} remboursé par anticipation : -${money(l.debt, t)}`, "info"); S.loans.splice(i, 1); return true; }
// Chaque mois : intérêts, mensualités, et ce qui arrive quand on ne peut plus payer
function loanMonth(t) {
  if (S.plan && t >= S.plan.until) { const rest = loanDebt(); S.loans = []; S.plan = null; logE(t, rest > 1 ? `Fin du plan de surendettement : ${money(rest, t)} de dettes effacés` : "Fin du plan de surendettement", "good"); }
  if (!S.loans.length) { S.missed = 0; return; }
  let miss = false;
  for (let i = S.loans.length - 1; i >= 0; i--) {
    const l = S.loans[i], int = l.debt * l.rate / 12, due = dueOf(l, t);
    const room = holdSum() + Math.max(0, baseSalary(t) - S.overdraft);   // épargne + découvert autorisé (un mois de salaire)
    if (room >= due) { payCash(due, t); S.interestPaid += int; l.debt = l.debt + int - due; if (l.debt < 1) { S.loans.splice(i, 1); logE(t, `${LOAN_N[l.kind]} entièrement remboursé`, "good"); } }
    else { miss = true; const pen = S.plan ? 0 : 0.08 * due; l.debt += int + pen; S.interestPaid += int + pen; }
  }
  if (!miss) { S.missed = 0; return; }
  S.missed++;
  if (S.missed === 1) logE(t, "Mensualité de crédit impayée : pénalités de retard de 8 %", "bad");
  if (S.missed === 2 && !ficp(t)) { S.ficpUntil = t + 60; logE(t, t >= mi(1989, 12) ? "Deuxième impayé : te voilà fiché·e à la Banque de France (FICP) pour 5 ans. Plus aucun crédit possible" : "Deuxième impayé : ta banque te ferme tout crédit pour 5 ans", "bad"); }
  if (S.missed >= 4 && !S.plan && t >= mi(1990, 1)) {   // commission de surendettement (loi Neiertz, 1990)
    const D0 = loanDebt() + S.overdraft, n = 84; S.loans = [{kind:"plan", debt:D0, rate:0, pay:Math.min(D0 / n, 0.25 * baseSalary(t)), t0:t}];
    S.overdraft = 0; S.plan = {until:t + n}; S.ficpUntil = Math.max(S.ficpUntil, t + n); S.missed = 0;
    logE(t, `Commission de surendettement : tes dettes (${money(D0, t)}) sont regroupées sans intérêts, remboursées sur 7 ans. Ton épargne est bloquée sur le Livret A, et le reste sera effacé à la fin`, "bad");
  }
}

// ===== Journal =====
function logE(t, txt, c) { S.log.unshift({t, txt, c}); if (S.log.length > 400) S.log.pop(); if (c === "good") S.lastGood = t; if (c === "bad") S.lastBad = t; }

// ===== Événements de vie =====
const pYear = p => RNG() < p / 12;
const MD = () => MODES[S.mode] || MODES.tranquille;
const pBad = p => pYear(p * MD().p);          // incident (plus fréquent dans les modes durs)
const cost = x => x * MD().c;                  // coût d'un incident
// Taux de chômage par époque (INSEE, ordres de grandeur) : sert à caler le risque de licenciement du mode Tranquille
const CHOMAGE = [[1955,1.5],[1968,2.5],[1975,3.5],[1980,6],[1985,9.5],[1990,8.5],[1997,10.5],[2001,8],[2008,7.5],[2013,10],[2017,9.5],[2019,8.3],[2022,7.3],[2025,7.5]];
function chomage(y) { let v = CHOMAGE[0][1]; for (let i = 0; i < CHOMAGE.length - 1; i++) { const [a, va] = CHOMAGE[i], [b, vb] = CHOMAGE[i + 1]; if (y >= a && y <= b) v = va + (vb - va) * (y - a) / (b - a); if (y > b) v = vb; } return v; }
function layoffRisk(t) {
  const y = yearOf(t), c = crisisOf(S.sector, y);
  let p = chomage(y) * 0.0045; // environ 0,45 licenciement par an pour 100 actifs et par point de chômage
  if (c) p *= c[3];
  if (S.sector === "public") p *= 0.1; else if (S.sector === "sante") p *= 0.4;
  if (carAge(t) > 12) p *= 1.4;
  if (t < S.trainedUntil) p *= 0.6;
  return p;
}
function reconvOptions(t) {
  const y = yearOf(t), ok = jobsFor(S.cat, y).filter(j => j[1] !== S.sector && !crisisOf(j[1], y));
  const opts = []; const pool = ok.slice();
  while (pool.length && opts.length < 3) opts.push(pool.splice(Math.floor(RNG() * pool.length), 1)[0]);
  return opts;
}
function lifeEvents(t) {
  const y = yearOf(t), a = age(t), base = baseSalary(t), mid = A[y].car;
  // crise du secteur : on prévient une fois par crise
  const c = crisisOf(S.sector, y);
  if (c && t >= S.unempUntil && !S.crisisSeen[S.sector + c[1]]) { S.crisisSeen[S.sector + c[1]] = 1; return modal("crise", {titre:c[4], jobs:reconvOptions(t)}); }
  if (!S.married && a >= 22 && a <= 40 && t >= S.noMarryUntil && pYear(y < 1975 ? 0.2 : y < 1995 ? 0.11 : 0.07)) return modal("mariage");
  if (S.married && !S.noKids && a < 42 && S.kids.length < 3 && t >= S.noKidsUntil && pYear(y < 1975 ? 0.3 : 0.22)) return modal("enfant");
  for (const kb of S.kids) if (t - kb === 18 * 12 && !S.kidStudy[kb]) return modal("etudes", {kb});
  if (carAge(t) >= 8 && t >= (S.carAskUntil || 0) && pYear(0.3)) return modal("voiture");
  // vieille voiture : pannes et accidents
  if (carAge(t) > 12 && pBad(0.3)) { const k = cost(0.08 * mid); spend(k, t, "Réparation de la voiture"); benchFlow(-k); logE(t, `Ta vieille voiture tombe en panne : -${money(k, t)} de réparations`, "bad"); return; }
  if (pBad(carAge(t) > 12 ? 0.03 : 0.015)) {
    const k = cost(S.ins.auto ? 0.03 * mid : 0.5 * mid); spend(k, t, S.ins.auto ? "Franchise d'assurance" : "Voiture à remplacer"); benchFlow(-k);
    if (!S.ins.auto) S.car = t;
    logE(t, S.ins.auto ? `Accident de voiture : ton assurance couvre, il reste la franchise (-${money(k, t)})` : `Accident de voiture sans assurance tous risques : -${money(k, t)} pour remplacer la voiture`, "bad"); return;
  }
  // santé
  if (pBad(0.05)) { const k = cost((S.ins.mutuelle ? 0.15 : 1.2) * base); spend(k, t, "Soins médicaux"); benchFlow(-k);
    logE(t, S.ins.mutuelle ? `Soins médicaux : ta mutuelle rembourse presque tout (-${money(k, t)})` : `Soins médicaux sans mutuelle : -${money(k, t)}`, "bad"); return; }
  if (t >= S.sickUntil && pBad(0.012)) { const m = Math.floor(rnd(3, 10)); S.sickUntil = t + m;
    logE(t, `Arrêt maladie de ${m} mois : ${S.ins.prev ? "ta prévoyance maintient 90 % de ton salaire" : "sans prévoyance, ton salaire tombe à 50 %"}`, "bad"); return; }
  // emploi
  if (t >= S.unempUntil && t >= S.reconvUntil && pBad(layoffRisk(t))) {
    const m = Math.floor(rnd(9, 24)); S.unempUntil = t + m;
    logE(t, `Licenciement : ${m} mois au chômage, revenus réduits de 40 %`, "bad");
    if (c) return modal("reconv", {jobs:reconvOptions(t)});
    return;
  }
  if (a < 55 && t >= S.unempUntil && pYear(0.03)) return modal("mutation");
  if (pYear(CATS[S.cat].inh * MD().gifts)) { const g = 12 * base * rnd(0.5, 4); cashIn(g, t); benchFlow(g); logE(t, `Héritage d'un proche : +${money(g, t)}`, "good"); return; }
  if (S.married && pBad(y < 1975 ? 0.004 : 0.012)) {
    const loss = fin() * 0.5; for (const id in S.hold) { S.hold[id].v *= 0.5; S.hold[id].basis *= 0.5; }
    if (S.home) { S.home.value *= 0.5; S.home.debt *= 0.5; S.home.pay *= 0.5; }
    for (const l of S.loans) { l.debt *= 0.5; l.pay *= 0.5; }
    for (const k in S.bench) S.bench[k] *= 0.5;
    S.married = false; S.partner = null; S.divorced = true; S.noMarryUntil = t + 36;
    logE(t, `Divorce : le patrimoine est partagé (-${money(loss, t)})`, "bad"); return;

  const promo = 0.06 * MD().promo * boomOf(S.sector, y) * (t < S.trainedUntil ? 1.5 : 1) * (t < S.stallUntil ? 0.3 : 1) * (carAge(t) > 12 ? 0.6 : 1);
  if (t >= S.unempUntil && pYear(promo)) { S.salMult *= rnd(1.06, 1.15); logE(t, "Promotion : ton salaire augmente", "good"); return; }
  if (pYear(0.06 * MD().gifts)) { const g = base * rnd(1, 2); cashIn(g, t); benchFlow(g); logE(t, `Prime exceptionnelle : +${money(g, t)}`, "good"); return; }
  if (pBad(0.03)) {
    const opts = [["Aide à tes parents âgés", 0.2]];
    if (S.home) opts.push(["Travaux urgents dans ton logement", 0.15]); else opts.push(["Déménagement imprévu", 0.08]);
    const [txt, k] = pick(opts), cst = cost(12 * base * k); payCash(cst, t); benchFlow(-cst);
    logE(t, `${txt} : -${money(cst, t)}`, "bad");
  }
}
function doTraining(t) {
  const c = 1.5 * baseSalary(t); payCash(c, t); benchFlow(-c); S.trainedUntil = t + 60;
  logE(t, `Formation professionnelle : -${money(c, t)}. Moins de risque de licenciement et plus de promotions pendant 5 ans`, "info");
}
const canTrain = t => t >= S.trainedUntil - 24 && t >= S.unempUntil;
function reconvert(t, job) {
  const c = 3 * baseSalary(t); payCash(c, t); benchFlow(-c);
  S.job = job[0]; S.sector = job[1]; S.reconvUntil = t + 6; S.salMult *= 0.95; S.unempUntil = Math.min(S.unempUntil, t);
  logE(t, `Reconversion : tu deviens ${job[0]} (${SECTORS[job[1]]}). Formation : -${money(c, t)}, puis 6 mois à 70 % du salaire`, "info");

// ===== Pas de simulation : un mois =====
function step() {
  // une grosse dépense attend ta décision : on te demande une fois comment payer, sinon elle part sur ton épargne
  if (S.pendingPay) { if (!S.pendingPay.asked && !S.fast) { S.pendingPay.asked = true; modal("payer", {}); return; } settlePay("epargne"); }
  const t = S.t, y = yearOf(t);
  // rendements
  const ghosts = S.ghost ? Object.values(S.ghost) : [];
  for (const a of ASSETS) { // indice de prix de chaque placement (pour les ordres) et valeur de ce que tu détiens
    if (t < a.from && !S.hold[a.id] && !ghosts.some(g => g.hold[a.id])) continue;
    stream("marche", t, a.id); const z = gauss(), r = a.r(t, z); if (r == null) continue;
    S.px[a.id] = (S.px[a.id] || 1) * Math.max(0, 1 + r / 100);
    if (S.hold[a.id]) S.hold[a.id].v *= Math.max(0, 1 + r / 100);
    // le discipliné ne choisit pas ses actions : il a le rendement du marché, sans le bruit des titres individuels
    const rg = a.id === "actions" ? a.r(t, 0) : r;
    for (const g of ghosts) if (g.hold[a.id]) g.hold[a.id].v *= Math.max(0, 1 + rg / 100);
  }
  // impôt annuel sur les dividendes (compte-titres ; rien dans le PEA, l'assurance-vie, ni les fonds qui capitalisent)
  const dt = divTax(y) / 12;
  for (const [id, yd] of Object.entries(DIV_YIELD)) {
    const k = yd(t) / 100 * dt;
    if (S.hold[id]) { const c = S.hold[id].v * k; S.hold[id].v -= c; S.divTax += c; }
    for (const g of ghosts) if (g.hold[id]) g.hold[id].v *= 1 - k;
  }
  cryptoRisks(t);
  if (S.autopilot) { const fee = AUTOPILOT[S.autopilot.kind].fee / 12 / 100; for (const id in S.hold) S.hold[id].v *= 1 - fee; }
  processOrders(t);
  if (S.overdraft > 0) S.overdraft *= 1 + (A[y].cr + 4) / 1200;
  if (S.home) {
    S.home.value *= 1 + (D.house[t] - 0.25) / 100;
    if (S.home.debt > 0) {
      const int = S.home.debt * S.home.rate / 12;
      S.home.debt = Math.max(0, S.home.debt - (S.home.pay - int));
      if (S.home.debt === 0) logE(t, "Ton crédit immobilier est remboursé !", "good");
    }

  derivMonth(t); S.valT = t;
  if (S.autopilot && monthOf(t) === 11) runAutopilot(t + 1);
  const b = S.bench;
  b.cac *= 1 + D.fr_stocks[t] / 100; b.monde *= 1 + D.world[t] / 100; b.infl *= 1 + D.infl[t] / 100;
  for (const g of ghosts) if (g.od > 0) g.od *= 1 + (A[y].cr + 4) / 1200;
  if (S.ghost) { b.lazy = ghostVal(S.ghost.lazy); b.liv = ghostVal(S.ghost.liv); }
  // budget du mois
  const bu = budget(t);

  benchFlow(bu.saveGross);
  loanMonth(t);
  // événements
  stream("vie", t);
  if (!S.modal && S.kind !== "classique") lifeEvents(t);
  // gazette spéciale
  const g = GAZ.filter(e => e.t === t);
  for (const e of g) { if (!S.seenGaz[e.i]) { S.seenGaz[e.i] = 1; logE(t, e.titre, "news"); if (e.special && !S.modal) modal("special", {i:e.i}); } }
  pushHist();
  S.t++;
}
function pushHist() {
  const a = {}; for (const id in S.hold) a[id] = Math.round(S.hold[id].v);
  S.hist.push({t:S.t, s:Math.round(salary(S.t)), f:Math.round(fin()), n:Math.round(net()), a, h:S.home ? Math.round(S.home.value) : 0,
    d:Math.round((S.home ? S.home.debt : 0) + S.overdraft + loanDebt()), b:Object.fromEntries(Object.entries(S.bench).map(([k, v]) => [k, Math.round(v)]))});
}

// ===== Aller directement à la fin : réglages actuels, choix par défaut =====
const DEFAULT_OPT = {payer:0, enfant:1, mutation:0, crise:0, reconv:0, voiture:0, mariage:0, etudes:0, special:0, notif:0};
function fastForward() {
  if (S.screen === "decide" && allocOKe(S.t)) applyRebalance(S.t);
  S.fast = true; S.fastFrom = S.t; S.paused = false; S.menu = false;
  while (S.t <= S.end) {
    // un ménage prudent achète sa résidence principale dès que la banque suit, en gardant 6 mois de salaire de côté
    if (S.kind !== "classique" && !S.home && monthOf(S.t) === 0 && age(S.t) >= 25 && age(S.t) < 50) { const o = homeOffer(S.t); if (o.ok && fin() - o.cash > 6 * baseSalary(S.t)) buyHome(S.t); }
    step();

      let o = DEFAULT_OPT[k] || 0; if (k === "enfant") { stream("fin-enfant", S.t); o = RNG() < 0.5 ? 0 : 1; }
      if (sp) (sp.opts[o] || sp.opts[0]).go(); S.modal = null; }

  }

}
const allocOKe = t => Math.abs(unlocked(t).reduce((s, a) => s + (S.alloc[a.id] || 0), 0) - 100) < 0.05;

// ===== Conseils de l'entourage (pas toujours bons) =====
function r12(k, t) { let p = 1; for (let i = Math.max(0, t - 12); i < t; i++) p *= 1 + (D[k][i] || 0) / 100; return (p - 1) * 100; }
function adviceFor(t) {
  const y = yearOf(t), out = [];
  const bank = y < 1990 ? "Prenez donc notre SICAV maison, c'est la sécurité. (2 % de droits d'entrée, 2 % de frais par an)" :

  out.push(["Ton banquier", bank, "bad"]);
  const cac = r12("fr_stocks", t), gold = r12("gold", t), btc = t > mi(2014, 1) ? r12("btc", t) : 0, house5 = (() => { let p = 1; for (let i = Math.max(0, t - 60); i < t; i++) p *= 1 + D.house[i] / 100; return (p - 1) * 100; })();
  if (cac < -20) { out.push(["Ton beau-frère", "La Bourse c'est fini, moi j'ai tout vendu. Fais pareil avant qu'il ne soit trop tard !", "bad"]);
    out.push(["Une collègue", "Moi je continue d'investir un peu chaque mois. Ça finit toujours par remonter.", "good"]); }
  else if (btc > 100) out.push(["Ton beau-frère", "Le Bitcoin va encore faire x10, mets tout dedans !", "risk"]);
  else if (gold > 25) out.push(["Ton beau-frère", "L'or ne fait que monter, c'est la seule valeur sûre. Achète !", "bad"]);
  else if (cac > 30) out.push(["Ton beau-frère", "Tout le monde gagne en Bourse en ce moment. Emprunte pour acheter des actions !", "bad"]);
  else if (house5 > 40) out.push(["Ton beau-frère", "La pierre, ça ne baisse jamais. Achète un deuxième appartement !", "bad"]);
  else out.push(["Ton beau-frère", "Moi je laisse tout sur mon Livret A. Au moins, je dors tranquille.", "bad"]);
  return out;
}

// ===== Modales (choix) =====

// ----- Graphiques pixel -----
const CW = 240, CH = 100;
function pixLine(c, x0, y0, x1, y1, w) {
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for (;;) { c.fillRect(x0, y0, w, w); if (x0 === x1 && y0 === y1) break; const e2 = 2 * err; if (e2 > -dy) { err -= dy; x0 += sx; } if (e2 < dx) { err += dx; y0 += sy; } }
}
function chart(cv, series) { // series : [{col, w, get(h), dash, name}]
  cv.width = CW; cv.height = CH;
  const c = cv.getContext("2d"); c.imageSmoothingEnabled = false;
  c.fillStyle = cssVar("--screen") || "#100c20"; c.fillRect(0, 0, CW, CH);
  const H = S.hist, full = endT() - S.start + 1;
  // l'axe s'agrandit au fil de la vie : on voit bien les 5 dernières années bouger
  const span = S.screen === "end" ? Math.max(12, full) : Math.min(full, Math.max(60, S.t - S.start + 24));
  let mx = 1, mn = 0;
  for (const h of H) for (const s of series) { const v = s.get(h); if (v > mx) mx = v; if (v < mn) mn = v; }
  mx *= 1.06; const range = mx - mn || 1;
  const Y = v => Math.round((CH - 4) - (v - mn) / range * (CH - 8));
  c.fillStyle = "#2a2350";
  for (let x = 0; x < CW; x += 20) for (let y = 0; y < CH; y += 10) c.fillRect(x, y, 1, 1);
  if (mn < 0) { c.fillStyle = "#4a3f80"; c.fillRect(0, Y(0), CW, 1); }
  // repères des décennies
  c.fillStyle = "#3a3170";
  for (let t = S.start; t <= S.end; t++) if (monthOf(t) === 0 && yearOf(t) % 10 === 0 && t - S.start <= span) c.fillRect(Math.round((t - S.start) / span * (CW - 3)), 0, 1, CH);
  for (const s of series) {
    c.fillStyle = s.col; let p = null, i = 0;
    for (const h of H) {
      const x = Math.round((h.t - S.start) / span * (CW - 3)), y = Math.min(CH - 2, Math.max(0, Y(s.get(h))));
      if (p && (!s.dash || (i++ % 4) < 2)) pixLine(c, p[0], p[1], x, y, s.w);
      p = [x, y];
    }
  }
  cv._meta = {span, series, mx, mn};
  return {mx, mn};
}

function bindTouch(cv) {

  const show = ev => {
    const m = cv._meta; if (!m || !S) return;
    const r = cv.getBoundingClientRect(), x = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    const tt = S.start + Math.round(x * m.span), h = S.hist.reduce((b, k) => Math.abs(k.t - tt) < Math.abs(b.t - tt) ? k : b, S.hist[0]);
    tip.innerHTML = `<b>${dateLab(h.t)}</b>` + m.series.filter(s => s.name).slice().reverse().map(s => `<span><i style="background:${s.col}"></i>${esc(s.name)} : ${money(s.get(h), h.t)}</span>`).join("");
    tip.hidden = false; tip.style.left = Math.min(r.width - 170, Math.max(0, ev.clientX - r.left - 85)) + "px"; tip.style.top = (cv.offsetTop + cv.offsetHeight + 4) + "px";

  if ($("apon")) $("apon").onclick = () => { const k = S.apKind && t >= AUTOPILOT[S.apKind].from ? S.apKind : Object.keys(AUTOPILOT).filter(k => t >= AUTOPILOT[k].from).pop();
    S.autopilot = {kind:k, profile:S.apProf || "equilibre"}; runAutopilot(t); logE(t, `Pilote automatique activé : ${AUTOPILOT[k].n}`, "info"); re(); };

  app.querySelectorAll("[data-ocancel]").forEach(b => b.onclick = () => { S.orders.splice(+b.dataset.ocancel, 1); re(); });
}

// ----- Animation de l'année : pièces, tremblements, son -----
function startLoop() {
  stopLoop();
  const tick = () => {
    if (S.screen !== "sim" || S.paused || S.modal || S.menu) { if (S.paused && S.screen === "sim") renderOverlay(); return; }
    if (S.t >= S.nextStop) { S.screen = S.t > S.end ? "end" : "decide"; S.tab = "gazette"; SFX.year(); render(); scrollTo(0, 0); return; }
    const g0 = S.lastGood, b0 = S.lastBad;
    step(); updateHud(); drawCharts(); if ($("lg")) $("lg").innerHTML = logHTML();
    if (S.lastGood !== g0) { coins(); SFX.coin(); }
    if (S.lastBad !== b0) shake();
    if (monthOf(S.t) === 0) saveGame();
    if (S.modal || S.paused) { saveGame(); renderOverlay(); return; }
    timer = setTimeout(tick, REDUCE() ? 60 : 600 / S.speed);
  };
  timer = setTimeout(tick, 200);
}

// ----- Bilan final : objectifs, meilleurs coups, erreurs -----
const _renderEnd = renderEnd;
renderEnd = function () {

    ["Finir avec au moins 10 ans de salaire de patrimoine", yrs >= 10],

    ["Faire mieux que l'inflation", f >= b.infl],
    ["Faire mieux que le Livret A", f >= b.liv],

  const pl = {}; for (const id in S.pnl) pl[id] = S.pnl[id]; for (const id in S.hold) pl[id] = (pl[id] || 0) + S.hold[id].v - S.hold[id].basis;
  const ranked = Object.entries(pl).filter(([, v]) => Math.abs(v) > 1).sort((a, b) => b[1] - a[1]);
  const best = ranked.filter(([, v]) => v > 0).slice(0, 3), worst = ranked.filter(([, v]) => v < 0).slice(-3).reverse();
  const panics = S.panic.map(p => ({...p, lost:p.amount * ((S.px[p.id] || p.px) / p.px - 1)})).filter(p => p.lost > 0);

      ${worst.length ? `<h3>CE QUI T'A LE PLUS COÛTÉ</h3><table class="h">${worst.map(row).join("")}</table>` : ""}
      ${panics.length ? `<h3>VENTES PANIQUES</h3>${panics.map(p => `<p class="small">En ${dateLab(p.t)}, tu as vendu ${money(p.amount, p.t)} de ${esc(AS[p.id].n)} juste après une chute de la Bourse. En gardant jusqu'au bout, tu aurais gagné environ <b class="bad">${today(p.lost, t)}</b> de plus.</p>`).join("")}` : `<p class="small good">Aucune vente panique : tu as gardé ton sang-froid pendant les krachs.</p>`}

      ${(S.pnl.btc || 0) + (S.hold.btc ? S.hold.btc.v - S.hold.btc.basis : 0) > 0.3 * Math.max(1, f - S.startCap) ? `<p class="small">Une grosse part de tes gains vient du Bitcoin. C'est surtout la chance de ton époque : le même pari tout sur un seul actif, sur l'or en 1980 ou sur les valeurs internet en 2000, aurait fait perdre la moitié de la mise ou plus.</p>` : ""}

    bar.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => { S.speed = +b.dataset.sp; bar.querySelectorAll("[data-sp]").forEach(x => x.setAttribute("aria-pressed", +x.dataset.sp === S.speed)); });
    $("vff").onclick = () => { stopLoop(); S.menu = "fin"; renderOverlay(); };
    $("vmenu").onclick = () => { stopLoop(); S.menu = true; renderOverlay(); };
    return;
  }
  _barV();
};
startLoop = function () {
  if (!isVie()) return _loopV();
  stopLoop();
  const tick = () => {
    if (S.screen !== "sim" || S.paused || S.modal || S.menu) { if (S.paused && S.screen === "sim") renderOverlay(); return; }
    if (S.t >= S.nextStop) { S.screen = S.t > S.end ? "end" : "decide"; S.tab = "gazette"; S.rdvStep = 0; S.rdvDetail = false; S.endSlide = 0; S.endDetail = false; SFX.year(); render(); scrollTo(0, 0); return; }
    const g0 = S.lastGood, b0 = S.lastBad, n0 = net();
    step(); frameVie();
    if (S.lastGood !== g0) { stageCoins(); SFX.coin(); }
    if (S.lastBad !== b0 || net() < n0 * 0.93) { stageShake(); if (S.lastBad !== b0) SFX.crash(); }
    if (monthOf(S.t) === 0) saveGame();
    if (S.modal || S.paused) { saveGame(); renderOverlay(); return; }
    timer = setTimeout(tick, REDUCE() ? 60 : 600 / S.speed);
  };
  timer = setTimeout(tick, 250);
};
renderOverlay = function () {
  _ovV();
  // en reprenant après une pause, un choix ou un menu, on revient à la scène
  if (isVie() && S.screen === "sim") { const r = $("resume"), a = $("apply"); [r, a].forEach(b => { if (b) { const f = b.onclick; b.onclick = e => { f && f(e); if (S.screen === "sim" && !S.paused && !S.modal && !S.menu) { renderBar(); startLoop(); } }; } }); }
};
// les écrans hors partie (accueil, choix, naissance) reprennent les couleurs normales
const _titleV = renderTitle, _chooseV = renderChoose, _profileV = renderProfile;
renderTitle = function () { clearEra(); _titleV(); };
renderChoose = function () { clearEra(); _chooseV(); };
renderProfile = function () { clearEra(); _profileV(); };
// ===================== STYLE « ILLUSTRÉ DOUX » (mode Classique) =====================
// Même déroulé que la Vie complète, habillé en illustration pastel au lieu des pixels.

// ----- Cible ou réalité : ce que tu possèdes s'éloigne de ce que tu as choisi, et pourquoi -----
function gapInfo(t) {
  const F = holdSum() || 1, ids = new Set([...unlocked(t).filter(a => (S.alloc[a.id] || 0) > 0).map(a => a.id), ...Object.keys(S.hold).filter(id => S.hold[id].v / F >= 0.01)]);
  const rows = [...ids].map(id => ({id, n:AS[id].n, cible:Math.round((S.alloc[id] || 0) * 10) / 10, reel:Math.round((S.hold[id] ? S.hold[id].v : 0) / F * 1000) / 10}))
    .sort((a, b) => b.cible - a.cible || b.reel - a.reel);
  return {rows, off:rows.some(r => Math.abs(r.reel - r.cible) >= 3) && holdSum() > 1};
}
const capsSince = since => S.log.filter(l => l.t >= since && /plein \(plafond/.test(l.txt));
function gapReasons(t) {
  const since = S.lastDecision ?? S.start, out = [], g = gapInfo(t);
  const spent = S.log.filter(l => l.t >= since && l.c === "bad" && !/Réallocation|Licenciement|Arrêt maladie/.test(l.txt));
  if (spent.length) out.push(`${spent.length} dépense${spent.length > 1 ? "s" : ""} imprévue${spent.length > 1 ? "s" : ""} payée${spent.length > 1 ? "s" : ""} avec ton épargne la plus sûre, Livret A en premier.`);
  for (const l of capsSince(since)) out.push(l.txt + ".");
  const risky = g.rows.filter(r => AS[r.id].risk >= 3), dr = risky.reduce((s, r) => s + r.reel - r.cible, 0);
  if (dr >= 3) out.push("Tes placements risqués ont monté plus vite que les autres : leur part a grossi toute seule.");
  if (dr <= -3) out.push("Tes placements risqués ont baissé : leur part a fondu.");
  if (!out.length && g.off) out.push("Les marchés ont bougé depuis ton dernier choix : chaque placement a évolué à son rythme.");
  return out;
}
function gapHTML(t) {
  const g = gapInfo(t); if (!g.rows.length || holdSum() < 1) return "";
  const mx = Math.max(100, ...g.rows.map(r => r.reel));
  return `<div class="gap"><div class="gaphead"><span>Ta cible</span><span>La réalité</span></div>
    ${g.rows.map(r => { const d = r.reel - r.cible, cls = Math.abs(d) >= 3 ? (d > 0 ? "up" : "down") : "";
      return `<div class="gaprow ${cls}"><span class="gn">${esc(r.n)}</span><span class="gv">${fmtP(r.cible)} %${cls ? ` → <b>${fmtP(r.reel)} %</b>` : ""}</span>
        <div class="gbar" aria-hidden="true"><i class="gt" style="width:${r.cible / mx * 100}%"></i><i class="gr" style="width:${r.reel / mx * 100}%"></i></div></div>`; }).join("")}
    ${g.off ? `<div class="gwhy"><b>Pourquoi ?</b>${gapReasons(t).map(x => `<p>${esc(x)}</p>`).join("")}</div>` : `<p class="small muted">Ta répartition réelle colle à ta cible.</p>`}</div>`;
}
// coût d'un retour complet à la cible (frais et impôts), même si la répartition n'a pas changé
const previewCostFull = t => rebalancePlan(t, JSON.parse(JSON.stringify(S.hold)));

// ----- La scène de vie, dessinée -----
const DSKIN = ["#F2C9A0", "#D9A27A", "#C98A5E", "#7A4E33"], DHAIR = ["#3A2A22", "#6B4630", "#C9964E", "#1E1E24"];
const DWALL = [[1955, "#F7E6CC", "#EFD6B0", "none"], [1968, "#FAD9B5", "#F6C590", "stripes"], [1980, "#E7DDF7", "#D4C6F2", "tri"],
  [1990, "#D8EEF6", "#BFE3EF", "dots"], [2000, "#ECE8E2", "#DED8CF", "none"], [2013, "#F6F2EC", "#EAE3D9", "none"]];
function dOutfit(t) { if (t < S.unempUntil) return "#B9B3C4"; if (S.cat === "cadres" || S.sector === "banque") return "#5C6E9E";
  if (["industrie", "mines", "textile", "btp", "transport", "auto"].includes(S.sector)) return "#7FA6D9"; if (S.sector === "sante") return "#9ED7C8"; return "#FF9F7A"; }
function dPerson(x, y, o) {
  const hair = o.age >= 62 ? "#D9D6DE" : o.age >= 50 ? "#9E98A6" : DHAIR[o.hair], skin = DSKIN[o.skin];
  const mouth = o.mood === "happy" ? `<path d="M${x - 7} ${y + 10} Q${x} ${y + 17} ${x + 7} ${y + 10}" fill="none" stroke="#2D2A3E" stroke-width="2.5" stroke-linecap="round"/>`
    : o.mood === "sad" ? `<path d="M${x - 6} ${y + 14} Q${x} ${y + 8} ${x + 6} ${y + 14}" fill="none" stroke="#2D2A3E" stroke-width="2.5" stroke-linecap="round"/>`
    : `<path d="M${x - 5} ${y + 12} L${x + 5} ${y + 12}" stroke="#2D2A3E" stroke-width="2.5" stroke-linecap="round"/>`;
  const longHair = o.fem ? `<path d="M${x - 22} ${y - 2} C${x - 26} ${y + 22} ${x - 18} ${y + 30} ${x - 14} ${y + 26} L${x - 14} ${y} Z M${x + 22} ${y - 2} C${x + 26} ${y + 22} ${x + 18} ${y + 30} ${x + 14} ${y + 26} L${x + 14} ${y} Z" fill="${hair}"/>` : "";
  const top = o.bald ? `<path d="M${x - 21} ${y - 2} C${x - 22} ${y - 10} ${x - 16} ${y - 12} ${x - 14} ${y - 8} Z M${x + 21} ${y - 2} C${x + 22} ${y - 10} ${x + 16} ${y - 12} ${x + 14} ${y - 8} Z" fill="${hair}"/>`
    : `<path d="M${x - 22} ${y - 2} C${x - 20} ${y - 26} ${x + 20} ${y - 26} ${x + 22} ${y - 2} C${x + 16} ${y - 12} ${x - 14} ${y - 12} ${x - 22} ${y - 2} Z" fill="${hair}"/>`;
  const glasses = o.glasses ? `<circle cx="${x - 8}" cy="${y + 2}" r="6" fill="none" stroke="#2D2A3E" stroke-width="2"/><circle cx="${x + 8}" cy="${y + 2}" r="6" fill="none" stroke="#2D2A3E" stroke-width="2"/><path d="M${x - 2} ${y + 2} L${x + 2} ${y + 2}" stroke="#2D2A3E" stroke-width="2"/>` : "";
  return `${longHair}<rect x="${x - 20}" y="${y + 22}" width="40" height="40" rx="14" fill="${o.top}"/><circle cx="${x}" cy="${y}" r="22" fill="${skin}"/>${top}
    <circle cx="${x - 8}" cy="${y + 2}" r="2.5" fill="#2D2A3E"/><circle cx="${x + 8}" cy="${y + 2}" r="2.5" fill="#2D2A3E"/>${glasses}${mouth}`;
}
function dKid(x, y, k, skin) { return `<rect x="${x - 11}" y="${y + 12}" width="22" height="22" rx="8" fill="${["#FFB3C7", "#9ED7C8", "#BFD3FF"][k % 3]}"/><circle cx="${x}" cy="${y}" r="12" fill="${DSKIN[skin]}"/>
  <path d="M${x - 12} ${y - 1} C${x - 10} ${y - 15} ${x + 10} ${y - 15} ${x + 12} ${y - 1} Z" fill="${DHAIR[(k + 1) % 4]}"/><circle cx="${x - 4}" cy="${y + 1}" r="1.8" fill="#2D2A3E"/><circle cx="${x + 4}" cy="${y + 1}" r="1.8" fill="#2D2A3E"/>`; }
function drawSceneDoux(el, t) {
  if (!el) return;
  const y = yearOf(t), w = DWALL.filter(d => y >= d[0]).pop(), L = S.look, a = age(t), home = !!S.home, unemp = t < S.unempUntil;
  const r1 = D.fr_stocks[Math.max(0, t)] || 0, storm = r1 < -6, winter = monthOf(t) === 11 || monthOf(t) <= 1, rich = net() > 10 * 12 * baseSalary(t);
  let deco = "";
  if (w[3] === "stripes") for (let x = 0; x < 350; x += 28) deco += `<rect x="${x}" y="0" width="12" height="160" fill="${w[2]}"/>`;
  if (w[3] === "tri") for (let x = 10; x < 350; x += 46) deco += `<path d="M${x} 30 l9 -14 l9 14 Z" fill="${w[2]}"/><circle cx="${x + 24}" cy="70" r="4" fill="${w[2]}"/>`;
  if (w[3] === "dots") for (let x = 12; x < 350; x += 26) for (let yy = 14; yy < 150; yy += 26) deco += `<circle cx="${x + (yy % 52 ? 13 : 0)}" cy="${yy}" r="3" fill="${w[2]}"/>`;
  // la fenêtre : ville ou jardin, orage quand la Bourse chute, neige en hiver
  const sky = storm ? "#A9B3C6" : y >= 2013 ? "#CFE5F2" : "#BFE6F2";
  let win = `<rect x="226" y="22" width="100" height="80" rx="14" fill="${sky}"/>`;
  win += home ? `<rect x="226" y="78" width="100" height="24" fill="#A8D8A0"/><circle cx="300" cy="70" r="14" fill="#7FC28A"/><rect x="298" y="74" width="4" height="14" fill="#9C7A5A"/>`
    : `<rect x="236" y="62" width="18" height="40" fill="#E6D6C9"/><rect x="258" y="50" width="20" height="52" fill="#D9CDE6"/><rect x="282" y="66" width="18" height="36" fill="#F1DCC2"/><rect x="304" y="56" width="16" height="46" fill="#D2E2EC"/>`;
  win += storm ? `<path d="M290 30 l-8 14 h8 l-6 14" fill="none" stroke="#FFE07A" stroke-width="3" stroke-linejoin="round"/>` : `<circle cx="304" cy="40" r="10" fill="#FFF1B8"/>`;
  if (winter) for (let k = 0; k < 9; k++) win += `<circle cx="${234 + (k * 23) % 88}" cy="${30 + (k * 17) % 56}" r="2.2" fill="#FFFFFF"/>`;
  win += `<rect x="274" y="22" width="4" height="80" fill="${w[1]}"/>`;
  // la télé ou l'ordinateur de l'époque, avec ta courbe dessus
  const H = S.hist, n = Math.min(120, H.length), from = H.length - n, vals = n > 1 ? H.slice(from).map(h => h.n) : [0, 0];
  const mx = Math.max(...vals, 1), mn = Math.min(...vals, 0);

  else if (y < 1995) { tv = `<rect x="22" y="70" width="84" height="54" rx="8" fill="#CFC6B6"/><rect x="40" y="124" width="52" height="36" rx="4" fill="#C9A78A"/><rect x="110" y="106" width="22" height="18" rx="3" fill="#E4DAC4"/>`; sx = 30; sy = 76; sw = 68; sh = 40; }
  else if (y < 2005) { tv = `<rect x="20" y="124" width="96" height="36" rx="4" fill="#C9A78A"/><rect x="30" y="64" width="72" height="56" rx="8" fill="#E8E2D2"/><rect x="56" y="120" width="20" height="6" fill="#D2CBB8"/>`; sx = 38; sy = 70; sw = 56; sh = 42; }
  else { tv = `<rect x="16" y="130" width="104" height="30" rx="4" fill="#C9A78A"/><rect x="14" y="58" width="108" height="66" rx="6" fill="#2D2A3E"/><rect x="62" y="124" width="12" height="6" fill="#2D2A3E"/>`; sx = 20; sy = 64; sw = 96; sh = 54; }
  const pts = vals.map((v, k) => `${(sx + 4 + k * (sw - 8) / Math.max(1, vals.length - 1)).toFixed(1)},${(sy + sh - 6 - (v - mn) / (mx - mn || 1) * (sh - 14)).toFixed(1)}`).join(" ");
  tv += `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="4" fill="#2D2A3E"/><polyline points="${pts}" fill="none" stroke="#7FD1B9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  // canapé, plante, tableau quand l'argent le permet

  const plant = `<rect x="292" y="124" width="20" height="36" rx="6" fill="#E9A07A"/><circle cx="302" cy="114" r="17" fill="#7FD1B9"/>`;
  const art = rich ? `<rect x="150" y="18" width="62" height="44" rx="6" fill="#FFFFFF"/><rect x="156" y="24" width="50" height="32" rx="4" fill="#FFD9C2"/><circle cx="170" cy="36" r="6" fill="#FF9F7A"/><path d="M158 54 L178 40 L200 54 Z" fill="#9ED7C8"/>` : "";
  const paper = unemp ? `<rect x="200" y="164" width="40" height="12" rx="2" fill="#FFFFFF" transform="rotate(-6 220 170)"/>` : "";
  const mood = t < S.unempUntil || t < S.sickUntil ? "sad" : moodAt(t);
  let people = dPerson(S.married ? 178 : 195, 82, {age:a, fem:L.fem, skin:L.skin, hair:L.hair, glasses:L.glasses && a >= 40, bald:!L.fem && L.bald && a >= 48, top:dOutfit(t), mood});
  if (S.married) people += dPerson(222, 84, {age:a, fem:!L.fem, skin:(L.skin + 1) % 4, hair:(L.hair + 2) % 4, top:"#FFB3C7", mood:"ok"});
  S.kids.filter(kb => kb <= t && t - kb < 240).slice(0, 3).forEach((kb, k) => { people += dKid(140 + k * 24 - (k === 2 ? 0 : 0), 132, k, L.skin); });
  el.innerHTML = `<svg viewBox="0 0 350 200" width="100%" aria-hidden="true"><rect width="350" height="200" fill="${w[1]}"/>${deco}<rect y="160" width="350" height="40" fill="#F6CDB0"/>
    ${win}${art}${tv}${sofa}${plant}${paper}${people}</svg>`;
}

// ----- Les écrans hors partie passent aussi au style illustré -----
const _titleD = renderTitle, _chooseD = renderChoose, _profileD = renderProfile;
renderTitle = function () { _titleD(); setDoux(true); };
renderChoose = function () { _chooseD(); setDoux(true); };
renderProfile = function () { _profileD(); setDoux(isDouxGame()); };

// anneau de répartition, en vectoriel
function donutSVG(parts, size, inner) {
  const tot = parts.reduce((s, p) => s + p[0], 0) || 1, c = size / 2, r = size / 2 - 10, C = 2 * Math.PI * r; let off = 0;
  const arcs = parts.map(([v, col]) => { const len = v / tot * C, a = `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>`; off += len; return a; }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Répartition"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#FAF0E8" stroke-width="16"/>${arcs}${inner || ""}</svg>`;
}
// ===================== DETTES (mode Vie complète) =====================
const PAYMODES = {demander:["Me demander", "à chaque grosse dépense"], epargne:["Mon épargne", "toujours"], credit:["À crédit", "si la banque accepte"]};
function dettesHTML(t) {

      <td>${money(l.debt, t)}<br><small class="muted">${money(dueOf(l, t), t)} / mois</small></td>

  return `<div class="box" id="dettes"><h2>TES DETTES</h2>
    ${S.plan ? `<p class="bad">Plan de surendettement jusqu'en ${yearOf(S.plan.until)} : aucun crédit, épargne bloquée sur le Livret A. Le reste des dettes sera effacé à la fin.</p>` :
      fich ? `<p class="bad">Fiché·e à la Banque de France jusqu'en ${yearOf(S.ficpUntil)} : aucun crédit possible, même immobilier.</p>` : ""}
    ${rows ? `<table class="h">${rows}</table><p class="small muted">Mensualités : ${money(loanDue(t), t)} par mois. Intérêts payés depuis le début : ${money(S.interestPaid, t)}.</p>` : `<p class="muted">Aucun crédit en cours.</p>`}
    ${S.overdraft > 1 ? `<p class="bad small">Découvert : ${money(S.overdraft, t)}, au taux de ${pctRate((A[yearOf(t)].cr + 4) / 100)}.</p>` : ""}

    <div class="seg" role="group" aria-label="Comment payer les grosses dépenses">${Object.entries(PAYMODES).map(([k, [l, d]]) => `<button data-pm="${k}" aria-pressed="${S.payMode === k}">${l}<small>${d}</small></button>`).join("")}</div>
    <p class="small muted">Une grosse dépense vaut au moins un mois de salaire. Les petites partent toujours sur ton épargne.</p>
    <h3>EMPRUNTER POUR INVESTIR</h3>
    ${amounts.length ? `<p class="small">Crédit sur 5 ans à ${pctRate(loanRate("invest", t))}, placé selon ta répartition. Les gains et les pertes sont amplifiés : si tes placements rapportent moins que le taux, tu perds.</p>
      <div class="seg">${amounts.map(a => `<button data-binv="${Math.round(a)}">${money(a, t)}<small>${money(annuity(a, loanRate("invest", t), 60), t)} / mois</small></button>`).join("")}</div>`
      : `<p class="small muted">${fich || S.plan ? "Impossible tant que tu es fiché·e." : t < S.unempUntil ? "Aucune banque ne prête à un chômeur." : "La banque refuse : tes mensualités dépasseraient 35 % de tes revenus."}</p>`}
  </div>`;
}
function bindDettes(t, re) {

  document.querySelectorAll("[data-binv]").forEach(b => b.onclick = () => { if (borrowToInvest(+b.dataset.binv, t)) { SFX.coin(); toast("Crédit accordé et placé"); } re(); });
}
// carte Budget du rendez-vous : les dettes juste en dessous
const _rdvD = renderRdv;
renderRdv = function () { _rdvD();
  if (S.kind !== "classique" && S.rdvStep === 2 && $("vnext")) { $("vnext").insertAdjacentHTML("beforebegin", dettesHTML(S.t)); bindDettes(S.t, () => keepScroll(renderRdv)); } };
// onglet Budget détaillé
const _decideD = renderDecide;
renderDecide = function () { _decideD();
  if (S.kind !== "classique" && S.rdvDetail && (S.tab || "gazette") === "budget") { app.insertAdjacentHTML("beforeend", dettesHTML(S.t)); bindDettes(S.t, () => keepScroll(render)); } };
// ===== Démarrage =====
applyTheme();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S) drawCharts(); }); } catch (e) {}
function start(data) { if (data && data.S) { S = data.S; if (S.screen === "sim") S.paused = true; } render(); }
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
